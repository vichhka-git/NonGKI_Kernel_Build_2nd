name: Auto Approve Copilot Workflow Runs

on:
  workflow_run:
    workflows:
      - "CI Test - OnePlus 7 Fix Verification"
    types:
      - requested

permissions:
  actions: write

jobs:
  approve:
    name: Auto-approve pending run
    runs-on: ubuntu-latest
    steps:
      - name: Approve workflow run
        run: |
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            "/repos/${{ github.repository }}/actions/runs/${{ github.event.workflow_run.id }}/approve"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
